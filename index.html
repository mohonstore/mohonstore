const SN=["pending","confirmed","shipped","delivered"],SL={pending:"অর্ডার জমা",confirmed:"কনফার্ম",shipped:"শিপড",delivered:"ডেলিভারড",cancelled:"বাতিল"};
const steps=s=>s=="cancelled"?'<span class="badge" style="color:var(--bad)">এই অর্ডারটি বাতিল করা হয়েছে</span>':`<div class="stp">${SN.map((k,i)=>`<div class="${i<=SN.indexOf(s)?"on":""}">${SL[k]}</div>`).join("")}</div>`;
function track(no){r(`<div class="nar"><h2>অর্ডার ট্র্যাক করুন</h2><div class="box"><input id="to" placeholder="অর্ডার নম্বর (যেমন MS12345)" value="${e(no||"")}"><input id="tm" type="tel" placeholder="অর্ডারের সময় দেওয়া মোবাইল নাম্বার"><button class="bt f" onclick="doTrack()">দেখুন</button></div><div id="tr"></div></div>`)}
async function doTrack(){const x=await sb.rpc("track_order",{p_order_no:$("#to").value,p_mobile:$("#tm").value});const o=x.data;if(x.error||!o)return $("#tr").innerHTML='<div class="em">অর্ডার পাওয়া যায়নি। অর্ডার নম্বর ও মোবাইল নাম্বার ঠিক আছে কিনা দেখুন।</div>';
$("#tr").innerHTML=`<div class="box"><b>অর্ডার ${e(o.order_no)}</b> <span class="badge">${SL[o.status]||SL.pending}</span>${steps(o.status)}${(o.items||[]).map(c=>`<div class="ci"><img src="${e(c.img)}" alt=""><div><b>${e(c.name)}</b><br><small>${[c.size,c.color].filter(Boolean).map(e).join(" · ")} × ${bd(c.qty)}</small></div></div>`).join("")}<div class="tot"><span>ডেলিভারি চার্জ</span><span>${tk(o.delivery_charge)}</span></div><div class="tot b"><span>মোট</span><span>${tk(+o.subtotal+ +o.delivery_charge)}</span></div></div>`}

async function profile(){const s=await session();
if(!s)return r(`<div class="box nar"><h2>${mode=="in"?"লগইন":"অ্যাকাউন্ট তৈরি করুন"}</h2>${mode=="up"?'<input id="n" placeholder="আপনার নাম"><input id="m" type="tel" placeholder="মোবাইল নাম্বার">':""}<input id="em" type="email" placeholder="ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><button class="bt f" onclick="auth()">${mode=="in"?"লগইন করুন":"সাইন আপ করুন"}</button><p class="alt">${mode=="in"?"অ্যাকাউন্ট নেই?":"আগেই অ্যাকাউন্ট আছে?"} <a href="#" onclick="mode='${mode=="in"?"up":"in"}';profile();return false">${mode=="in"?"সাইন আপ":"লগইন"}</a></p></div>`);
const m=s.user.user_metadata||{},x=await sb.from("orders").select("*").eq("user_id",s.user.id).order("created_at",{ascending:false});
r(`<div class="nar" style="max-width:600px"><div class="box"><h2>${e(m.name||"আমার প্রোফাইল")}</h2><p style="color:var(--mut)">${e(s.user.email)}${m.mobile?" · "+e(m.mobile):""}</p><button class="bt w" onclick="await_out()">লগআউট</button></div><div class="hh"><h2>আমার অর্ডার</h2></div>${(x.data||[]).map(o=>`<div class="box"><a href="#/track/${e(o.order_no)}"><b>${e(o.order_no)}</b></a> <span class="badge">${SL[o.status]||SL.pending}</span><br><small style="color:var(--mut)">${new Date(o.created_at).toLocaleDateString("bn-BD")} · ${tk(+o.subtotal+ +o.delivery_charge)}</small></div>`).join("")||'<div class="em">কোনো অর্ডার নেই</div>'}</div>`)}
async function auth(){const v=i=>($("#"+i)||{value:""}).value.trim(),em=v("em"),pw=$("#pw").value;if(!em||pw.length<6)return toast("ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন");
const x=mode=="in"?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw,options:{data:{name:v("n"),mobile:v("m"),cust:true}}});
if(x.error)return toast(/registered|exists/i.test(x.error.message)?"এই ইমেইল দিয়ে আগেই অ্যাকাউন্ট খোলা হয়েছে, লগইন করুন":/invalid/i.test(x.error.message)?"ইমেইল বা পাসওয়ার্ড ভুল":x.error.message);
let b="";try{b=sessionStorage.ret||"";sessionStorage.removeItem("ret")}catch(_){}b=b&&b!="#/profile"?b:"#/profile";if(location.hash==b)route();else location.hash=b}
async function await_out(){await sb.auth.signOut();mode="in";route()}

async function route(){const h=decodeURIComponent(location.hash.slice(1)||"/"),[,a,b,c]=h.split("/");
if(!a)home();else if(a=="section")section(b,c);else if(a=="search")search(b);else if(a=="product")product(b);else if(a=="cart")cartV();else if(a=="checkout")checkout();else if(a=="done")done(b);else if(a=="track")track(b);else if(a=="profile")profile();else home()}
window.addEventListener("hashchange",route);save();
app.innerHTML='<div class="em">লোড হচ্ছে...</div>';load().then(route);
</script></body></html>
